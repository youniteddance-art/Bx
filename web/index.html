<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Brix, Dichte und Extrakt direkt im Browser umrechnen.">
  <meta name="theme-color" content="#9e0450">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brix Umrechner">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Brix Umrechner</title>
  <style>
    :root {
      --berry: #9e0450;
      --berry-dark: #6f1748;
      --navy: #3a4969;
      --ink: #25324d;
      --muted: #7b8499;
      --line: #e2e6ee;
      --paper: #ffffff;
      --canvas: #f1f3f7;
      --soft: #fff9fc;
      --rose: #efb2cf;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 28px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    .app {
      width: min(1120px, 100%);
      min-height: min(760px, calc(100vh - 80px));
      display: grid;
      grid-template-columns: 0.82fr 1.18fr;
      overflow: hidden;
      border-radius: 32px;
      background: var(--paper);
      box-shadow: 0 28px 90px rgba(58, 73, 105, 0.16);
    }

    .intro {
      position: relative;
      min-height: 500px;
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      color: white;
      background:
        radial-gradient(circle at 20% 18%, rgba(239, 178, 207, 0.18), transparent 32%),
        linear-gradient(145deg, var(--berry) 0%, var(--berry-dark) 50%, var(--navy) 100%);
    }

    .intro::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.08;
      background-image:
        linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 72%);
      pointer-events: none;
    }

    .intro-content, .method { position: relative; z-index: 2; }

    .eyebrow {
      margin: 0 0 24px;
      color: rgba(255,255,255,.72);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 430px;
      font-size: clamp(50px, 6vw, 68px);
      font-weight: 650;
      line-height: .98;
      letter-spacing: -.045em;
    }

    h1 span { color: var(--rose); }

    .intro-text {
      max-width: 360px;
      margin: 28px 0 0;
      color: rgba(255,255,255,.78);
      font-size: 16px;
      line-height: 1.7;
    }

    .method {
      display: flex;
      align-items: center;
      gap: 16px;
      color: rgba(255,255,255,.65);
      font-size: 14px;
    }

    .method::before {
      content: "";
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,.4);
    }

    .orb {
      position: absolute;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 50%;
      pointer-events: none;
    }

    .orb-large { width: 280px; height: 280px; right: -110px; top: 27%; }
    .orb-small { width: 160px; height: 160px; right: 44px; top: 38%; background: rgba(255,255,255,.035); }

    .calculator {
      padding: 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .calculator-header {
      margin-bottom: 32px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
    }

    .section-label {
      margin: 0;
      color: var(--berry);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h2 {
      margin: 7px 0 0;
      font-size: 32px;
      line-height: 1.15;
      letter-spacing: -.025em;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; }

    .reset, .install {
      border: 0;
      border-radius: 10px;
      padding: 10px 13px;
      color: #65708a;
      background: transparent;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      transition: .2s ease;
    }

    .reset:hover:not(:disabled), .reset:focus-visible { color: var(--berry); background: #f7edf2; }
    .reset:disabled { opacity: .4; cursor: default; }

    .install {
      display: none;
      color: white;
      background: var(--berry);
      box-shadow: 0 7px 20px rgba(158,4,80,.18);
    }

    .install.visible { display: inline-flex; }
    .install:hover, .install:focus-visible { background: var(--berry-dark); }

    .fields { display: grid; gap: 16px; }

    .field {
      min-width: 0;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: #fbfcfe;
      cursor: text;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .field:focus-within, .field.active {
      border-color: var(--berry);
      background: var(--soft);
      box-shadow: 0 8px 28px rgba(158,4,80,.08);
    }

    .field-name { display: block; font-weight: 700; }
    .field-hint { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }

    .input-wrap {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .field input {
      width: 175px;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      text-align: right;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -.025em;
    }

    .field input::placeholder { color: #cbd0da; }
    .unit { width: 48px; flex: 0 0 48px; color: var(--berry); font-size: 14px; font-weight: 750; }

    .message {
      min-height: 24px;
      margin: 19px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error { color: var(--danger); font-weight: 650; }

    @media (max-width: 900px) {
      body { padding: 20px; }
      .app { grid-template-columns: 1fr; min-height: auto; }
      .intro { min-height: 390px; padding: 40px; }
      .calculator { padding: 48px 40px; }
    }

    @media (max-width: 540px) {
      body { display: block; padding: 0; background: white; }
      .app { border-radius: 0; box-shadow: none; }
      .intro { min-height: 350px; padding: 32px 24px; }
      .calculator { padding: 38px 20px 48px; }
      .calculator-header { align-items: flex-start; }
      .field { align-items: flex-start; flex-direction: column; }
      .input-wrap { width: 100%; }
      .field input { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="intro" aria-labelledby="page-title">
      <div class="intro-content">
        <p class="eyebrow">Präzise umrechnen</p>
        <h1 id="page-title">Brix.<br>Dichte.<br><span>Extrakt.</span><br>Oechsle.</h1>
        <p class="intro-text">Einen Wert eingeben – die drei anderen werden sofort berechnet.</p>
      </div>
      <p class="method">Berechnung nach Näherungspolynom</p>
      <span class="orb orb-large" aria-hidden="true"></span>
      <span class="orb orb-small" aria-hidden="true"></span>
    </section>

    <section class="calculator" aria-labelledby="calculator-title">
      <header class="calculator-header">
        <div>
          <p class="section-label">Umrechner</p>
          <h2 id="calculator-title">Wert eingeben</h2>
        </div>
        <div class="header-actions">
          <button class="install" id="installButton" type="button">App installieren</button>
          <button class="reset" id="resetButton" type="button" disabled>Zurücksetzen</button>
        </div>
      </header>

      <div class="fields">
        <label class="field" data-field="brix">
          <span><span class="field-name">Brix</span><span class="field-hint">Zuckergehalt in Prozent</span></span>
          <span class="input-wrap"><input id="brix" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Brix in Grad Brix"><span class="unit">°Brix</span></span>
        </label>

        <label class="field" data-field="density">
          <span><span class="field-name">Dichte</span><span class="field-hint">Dichte der Lösung</span></span>
          <span class="input-wrap"><input id="density" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Dichte in Kilogramm pro Liter"><span class="unit">kg/l</span></span>
        </label>

        <label class="field" data-field="extract">
          <span><span class="field-name">Extrakt</span><span class="field-hint">Extraktgehalt pro Liter</span></span>
          <span class="input-wrap"><input id="extract" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Extrakt in Gramm pro Liter"><span class="unit">g/l</span></span>
        </label>

        <label class="field" data-field="oechsle">
          <span><span class="field-name">Oechsle</span><span class="field-hint">Mostgewicht der Lösung</span></span>
          <span class="input-wrap"><input id="oechsle" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Mostgewicht in Grad Oechsle"><span class="unit">°Oe</span></span>
        </label>
      </div>

      <p class="message" id="message" aria-live="polite">Dezimalzahlen können mit Komma oder Punkt eingegeben werden.</p>
    </section>
  </main>

  <script>
    "use strict";

    const inputs = {
      brix: document.getElementById("brix"),
      density: document.getElementById("density"),
      extract: document.getElementById("extract"),
      oechsle: document.getElementById("oechsle")
    };
    const message = document.getElementById("message");
    const resetButton = document.getElementById("resetButton");
    const installButton = document.getElementById("installButton");
    const fieldCards = document.querySelectorAll(".field");
    let installPrompt = null;

    function densityFromBrix(brix) {
      const b = brix / 100;
      return (998.20314 + 384.5888*b + 141.971*b**2 + 12.6678*b**3 + 51.7884*b**4 + 37.3002*b**5) / 1000;
    }

    function brixFromDensity(density) {
      return -1021.50225301072
        + 2688.83349883818 * density
        - 3038.30690645143 * density**2
        + 1931.7314171376 * density**3
        - 652.763639601096 * density**4
        + 92.476112168301 * density**5;
    }

    function brixFromExtract(extract) {
      let low = 0;
      let high = 100;
      for (let i = 0; i < 80; i += 1) {
        const middle = (low + high) / 2;
        const calculatedExtract = middle * densityFromBrix(middle) * 10;
        if (calculatedExtract < extract) low = middle;
        else high = middle;
      }
      return (low + high) / 2;
    }

    function brixFromOechsle(oechsle) {
      return 2.71818406161129e-4
        + 0.259075215802856 * oechsle
        - 2.4192924161003e-4 * oechsle**2
        + 3.15776483883696e-7 * oechsle**3
        - 5.3015952514334e-10 * oechsle**4
        + 9.25810377158387e-13 * oechsle**5
        - 9.98154673598115e-16 * oechsle**6
        + 4.57401897413907e-19 * oechsle**7;
    }

    function oechsleFromBrix(brix) {
      let low = 0;
      let high = 600;
      for (let i = 0; i < 80; i += 1) {
        const middle = (low + high) / 2;
        if (brixFromOechsle(middle) < brix) low = middle;
        else high = middle;
      }
      return (low + high) / 2;
    }

    function parseNumber(value) {
      const normalized = value.trim().replace(/\s/g, "").replace(",", ".");
      if (!normalized || normalized === "-" || normalized === ".") return null;
      const number = Number(normalized);
      return Number.isFinite(number) ? number : null;
    }

    function formatNumber(value, digits) {
      return value.toLocaleString("de-DE", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });
    }

    function setMessage(text, isError) {
      message.textContent = text;
      message.classList.toggle("error", Boolean(isError));
    }

    function clearOtherFields(activeField) {
      Object.keys(inputs).forEach(function (key) {
        if (key !== activeField) inputs[key].value = "";
      });
    }

    function updateFrom(activeField) {
      const rawValue = inputs[activeField].value;
      fieldCards.forEach(function (card) {
        card.classList.toggle("active", card.dataset.field === activeField && rawValue.trim() !== "");
      });

      if (!rawValue.trim()) {
        clearAll();
        return;
      }

      resetButton.disabled = false;
      const input = parseNumber(rawValue);
      if (input === null) {
        clearOtherFields(activeField);
        setMessage("Bitte eine gültige Zahl eingeben.", true);
        return;
      }

      let brix;
      if (activeField === "brix") brix = input;
      else if (activeField === "density") brix = brixFromDensity(input);
      else if (activeField === "extract") brix = brixFromExtract(input);
      else brix = brixFromOechsle(input);

      const density = densityFromBrix(brix);
      const extract = brix * density * 10;
      const oechsle = oechsleFromBrix(brix);

      if (brix < 0 || brix > 100 || ![brix, density, extract, oechsle].every(Number.isFinite)) {
        clearOtherFields(activeField);
        setMessage("Der Wert liegt außerhalb des unterstützten Bereichs von 0 bis 100 °Brix.", true);
        return;
      }

      if (activeField !== "brix") inputs.brix.value = formatNumber(brix, 2);
      if (activeField !== "density") inputs.density.value = formatNumber(density, 5);
      if (activeField !== "extract") inputs.extract.value = formatNumber(extract, 3);
      if (activeField !== "oechsle") inputs.oechsle.value = formatNumber(oechsle, 2);
      setMessage("Dezimalzahlen können mit Komma oder Punkt eingegeben werden.", false);
    }

    function clearAll() {
      Object.values(inputs).forEach(function (input) { input.value = ""; });
      fieldCards.forEach(function (card) { card.classList.remove("active"); });
      resetButton.disabled = true;
      setMessage("Dezimalzahlen können mit Komma oder Punkt eingegeben werden.", false);
    }

    Object.keys(inputs).forEach(function (key) {
      inputs[key].addEventListener("input", function () { updateFrom(key); });
      inputs[key].addEventListener("focus", function () {
        fieldCards.forEach(function (card) { card.classList.toggle("active", card.dataset.field === key && inputs[key].value.trim() !== ""); });
      });
    });

    resetButton.addEventListener("click", function () {
      clearAll();
      inputs.brix.focus();
    });

    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
      installPrompt = event;
      installButton.classList.add("visible");
    });

    installButton.addEventListener("click", async function () {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      installButton.classList.remove("visible");
    });

    window.addEventListener("appinstalled", function () {
      installPrompt = null;
      installButton.classList.remove("visible");
      setMessage("Die App wurde erfolgreich installiert.", false);
    });

    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {
          setMessage("Die Offline-Funktion konnte nicht aktiviert werden.", true);
        });
      });
    }
  </script>
</body>
</html>
